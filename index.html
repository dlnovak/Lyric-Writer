<!-- Storage layer: localStorage always, Firestore when signed in -->
<script>
window.Store = {
  uid: "guest",
  setUid: function (u) { this.uid = u || "guest"; },
  lsKey: function (kind) { return "lyricwriter:" + this.uid + ":" + kind; },
  readLocal: function (kind) {
    try { return JSON.parse(localStorage.getItem(this.lsKey(kind))) || {}; }
    catch (e) { return {}; }
  },
  writeLocal: function (kind, obj) {
    try { localStorage.setItem(this.lsKey(kind), JSON.stringify(obj)); } catch (e) {}
  },
  col: function (kind) {
    if (!window.fbDb || this.uid === "guest") return null;
    return window.fbDb.collection("users").doc(this.uid).collection(kind);
  },
  list: async function (kind) {
    var local = this.readLocal(kind);
    var c = this.col(kind);
    if (c) {
      try {
        var snap = await c.get();
        var remote = {};
        snap.forEach(function (d) { remote[d.id] = d.data(); });
        var merged = Object.assign({}, local, remote);
        this.writeLocal(kind, merged);
        return merged;
      } catch (e) { console.warn("Firestore read failed, using local copy:", e); }
    }
    return local;
  },
  set: async function (kind, id, data) {
    var all = this.readLocal(kind);
    all[id] = data;
    this.writeLocal(kind, all);
    var c = this.col(kind);
    if (c) { try { await c.doc(id).set(data); } catch (e) { console.warn("Firestore write failed:", e); } }
  },
  remove: async function (kind, id) {
    var all = this.readLocal(kind);
    delete all[id];
    this.writeLocal(kind, all);
    var c = this.col(kind);
    if (c) { try { await c.doc(id).delete(); } catch (e) { console.warn("Firestore delete failed:", e); } }
  }
};
</script>

  if (unset) {
    console.info("Lyric Writer: Firebase config not filled in — running locally with localStorage.");
    return;
  }
  if (typeof firebase === "undefined") {
    console.info("Lyric Writer: Firebase SDK unavailable — running locally with localStorage.");
    return;
  }
  try {
    firebase.initializeApp(cfg);
    window.fbAuth = firebase.auth();
    window.fbDb = firebase.firestore();
    window.fbGoogleProvider = new firebase.auth.GoogleAuthProvider();

    console.warn("Lyric Writer: Firebase init failed, continuing locally.", e);
  }
})();
